spring.application.name=Paperless_components
server.port=8081

spring.docker.compose.enabled=false

spring.datasource.url=jdbc:postgresql://postgres:5432/paperless
spring.datasource.username=user
spring.datasource.password=my_cool_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=rabbitmqadmin
spring.rabbitmq.password=rabbitmqadmin

spring.s3.endpoint-url=http://localhost:9000
spring.s3.access-key=minioadmin
spring.s3.secret-key=minioadmin
spring.s3.bucket-name=your-bucket-name
