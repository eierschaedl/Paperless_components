spring.application.name=Paperless_components
server.port=8081

spring.docker.compose.enabled=false

spring.datasource.url=jdbc:postgresql://postgres:5432/paperless
spring.datasource.username=user
spring.datasource.password=my_cool_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=rabbitmqadmin
spring.rabbitmq.password=rabbitmqadmin
